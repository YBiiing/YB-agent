name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v${PACKAGE_VERSION}" = "${GITHUB_REF_NAME}"

      - name: Build Python wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --no-deps --wheel-dir dist

      - name: Build and smoke test Docker image
        run: |
          docker build -t "yb-agent:${GITHUB_REF_NAME}" .
          docker run --rm "yb-agent:${GITHUB_REF_NAME}" --help

      - name: Export Docker image
        shell: bash
        run: docker save "yb-agent:${GITHUB_REF_NAME}" | gzip > "dist/yb-agent-${GITHUB_REF_NAME}-docker-image.tar.gz"

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum harness-*.whl yb-agent-*-docker-image.tar.gz > SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --verify-tag
          --title "Coding Agent Harness ${GITHUB_REF_NAME}"
          --notes-file "docs/RELEASE_NOTES_${GITHUB_REF_NAME}.md"
