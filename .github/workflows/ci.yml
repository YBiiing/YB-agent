name: Unit Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run unit tests
        shell: bash
        run: |
          set +e
          pytest tests/unit/ -v --tb=short 2>&1 | tee unit-test.log
          test_status=${PIPESTATUS[0]}
          set -e
          if [ "$test_status" -ne 0 ]; then
            failure_output=$(tail -n 30 unit-test.log)
            failure_output=${failure_output//'%'/'%25'}
            failure_output=${failure_output//$'\r'/'%0D'}
            failure_output=${failure_output//$'\n'/'%0A'}
            echo "::error title=Unit test failure::$failure_output"
            exit "$test_status"
          fi

      - name: Run mechanism demos
        run: pytest tests/demo/ -v --tb=short

  docker-build:
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t yb-agent:ci .

      - name: Smoke test Docker image
        run: docker run --rm yb-agent:ci --help
